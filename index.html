<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo de Dramas</title>
  
  <script>
    document.write('<scr' + 'ipt src="https:' + '//telegram.org/js/telegram-web-app.js"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="https:' + '//cdn.jsdelivr.net/npm/hls.js@latest"></scr' + 'ipt>');
  </script>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #0f0f13);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 14px;
    }
    header { display: flex; gap: 8px; margin-bottom: 12px; }
    select, input {
      background: var(--tg-theme-secondary-bg-color, #1e1e26);
      color: var(--tg-theme-text-color, #ffffff);
      border: 1px solid #333;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    select { flex: 1; max-width: 150px; }
    input { flex: 2; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #1a1a22);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .poster-wrap { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #252530; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .badge {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.8); color: #fff;
      font-size: 11px; padding: 3px 7px; border-radius: 6px; font-weight: 600;
    }
    .info { padding: 10px; }
    .title {
      font-size: 13px; font-weight: 600; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .status { font-size: 11px; color: var(--tg-theme-hint-color, #999); margin-top: 4px; }
    .loading { text-align: center; padding: 40px 0; color: #888; }
    #detalhe-view { display: none; }
    .btn-voltar {
      background: #2a2a35; color: #fff; border: none;
      padding: 8px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; cursor: pointer;
    }
    video {
      width: 100%; max-height: 65vh; background: #000;
      border-radius: 12px; margin-bottom: 12px; display: none;
    }
    .sinopse { font-size: 13px; color: #bbb; line-height: 1.45; margin: 10px 0 16px; }
    .ep-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .ep-btn {
      background: var(--tg-theme-secondary-bg-color, #1e1e28);
      color: #fff; border: 1px solid #333; padding: 10px 0;
      border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .ep-btn.ativo { background: #e50914; border-color: #e50914; }
  </style>
</head>
<body>

  <div id="home-view">
    <header>
      <select id="plataforma" onchange="carregarDramas()"></select>
      <input type="search" id="busca" placeholder="🔍 Buscar drama..." onkeyup="if(event.key==='Enter') buscarDramas()">
    </header>
    <div id="conteudo" class="loading">Carregando catálogo...</div>
  </div>

  <div id="detalhe-view">
    <button class="btn-voltar" onclick="voltarCatalogo()">← Voltar ao catálogo</button>
    <video id="player" controls playsinline></video>
    <div id="player-status" style="font-size:12px; color:#f5c518; margin-bottom:8px; word-break: break-all;"></div>
    <h2 id="det-titulo" style="font-size:18px; margin-bottom:6px;"></h2>
    <p id="det-sinopse" class="sinopse"></p>
    <h3 style="font-size:14px; margin-bottom:10px;">Episódios</h3>
    <div id="ep-lista" class="ep-grid"></div>
   </div>

  <script>
    const WORKER_URL = 'https:' + '//api-dramas-worker.dieginhomirante.workers.dev';

    const PLATAFORMAS = [
      ["storyreel","StoryReel"],["dramabox","DramaBox"],["reelshort","ReelShort"],["shortmax","ShortMax"],
      ["goodshort","GoodShort"],["flickreels","FlickReels"],["flextv","FlexTV"],["moboreels","MoboReels"],
      ["kalostv","Kalos TV"],["starshort","StarShort"],["stardusttv","StardustTV"],["vigloo","Vigloo"],
      ["netshort","NetShort"],["dramawave","DramaWave"],["mydrama","MyDrama"],["bilibilitv","Bilibili TV"],
      ["wetv","WeTV"],["iqiyi","iQIYI"],["youku","Youku"],["mango","MangoTV"],
      ["viki","Viki"],["kocowa","Kocowa"],["hitv","HiTV"],["kisskh","KissKH"],
      ["dramacool","DramaCool"],["asiancrush","AsianCrush"],["ondemandkorea","OnDemandKorea"],["sereal","Sereal+"],
      ["topshort","TopShort"],["shorts","ShortTV"],["playlet","Playlet"],["snackshort","SnackShort"],
      ["minishorts","MiniShorts"],["reelife","Reelife"],["dreamshort","DreamShort"],["honeyreels","HoneyReels"],
      ["joyreels","JoyReels"],["lavatv","LavaTV"],["loveshort","LoveShort"],["megashort","MegaShort"],
      ["microdrama","MicroDrama"],["minidrama","MiniDrama"],["novashort","NovaShort"],["pandashort","PandaShort"],
      ["peachshort","PeachShort"],["popshort","PopShort"],["quickshort","QuickShort"],["rapidshort","RapidShort"],
      ["redshort","RedShort"],["royalshort","RoyalShort"],["rushshort","RushShort"],["skyshort","SkyShort"],
      ["sparkshort","SparkShort"],["sunshort","SunShort"],["swiftshort","SwiftShort"],["tinyshort","TinyShort"],
      ["ultrashort","UltraShort"],["velvetshort","VelvetShort"],["zestshort","ZestShort"]
    ];

    let dramaAtualId = "";
    let episodiosMap = {};
    let hlsInstance = null;

    window.addEventListener('load', () => {
      const sel = document.getElementById("plataforma");
      sel.innerHTML = PLATAFORMAS.map(([val, nome]) => `<option value="${val}">${nome}</option>`).join("");
      carregarDramas();
    });

    async function carregarDramas() {
      const container = document.getElementById("conteudo");
      const plat = document.getElementById("plataforma").value;
      container.className = "loading";
      container.innerText = "Carregando dramas...";
      try {
        const res = await fetch(`${WORKER_URL}?endpoint=/api/v2/home&category_p=${plat}&lang=pt`);
        const json = await res.json();
        renderizarLista(json.data || []);
      } catch (e) {
        container.innerText = "Erro ao carregar: " + e.message;
      }
    }

    async function buscarDramas() {
      const q = document.getElementById("busca").value.trim();
      if (!q) return carregarDramas();
      const container = document.getElementById("conteudo");
      const plat = document.getElementById("plataforma").value;
      container.className = "loading";
      container.innerText = "Buscando...";
      try {
        const res = await fetch(`${WORKER_URL}?endpoint=/api/v2/search&category_p=${plat}&lang=pt&q=${encodeURIComponent(q)}`);
        const json = await res.json();
        renderizarLista(json.data || []);
      } catch (e) {
        container.innerText = "Erro na busca: " + e.message;
      }
    }

    function renderizarLista(lista) {
      const container = document.getElementById("conteudo");
      if (!lista.length) {
        container.className = "loading";
        container.innerText = "Nenhum drama encontrado nesta plataforma.";
        return;
      }
      container.className = "grid";
      container.innerHTML = lista.map(item => `
        <div class="card" onclick="abrirDrama('${item.id}', '${(item.title || '').replace(/'/g, "\\'")}')">
          <div class="poster-wrap">
            <img src="${item.cover}" alt="Capa" loading="lazy">
            <span class="badge">${item.chapters || item.total_episodes || '?'} eps</span>
          </div>
          <div class="info">
            <div class="title">${item.title}</div>
            <div class="status">${item.status || ''}</div>
          </div>
        </div>
      `).join("");
    }

    async function abrirDrama(id, titulo) {
      dramaAtualId = id;
      const plat = document.getElementById("plataforma").value;
      document.getElementById("home-view").style.display = "none";
      document.getElementById("detalhe-view").style.display = "block";
      document.getElementById("det-titulo").innerText = titulo;
      document.getElementById("det-sinopse").innerText = "Carregando episódios...";
      document.getElementById("ep-lista").innerHTML = "";
      document.getElementById("player").style.display = "none";
      document.getElementById("player-status").innerText = "";
      episodiosMap = {};

      try {
        const res = await fetch(`${WORKER_URL}?endpoint=/api/v2/detail&category_p=${plat}&lang=pt&id=${id}`);
        const json = await res.json();
        const dados = json.data || json;
        document.getElementById("det-sinopse").innerText = dados.synopsis || dados.sinopse || dados.description || "";
        const caps = dados.chapters || dados.capítulos || dados.episodes || [];
        
        caps.forEach(c => {
          episodiosMap[c.id] = c;
        });

        document.getElementById("ep-lista").innerHTML = caps.map(c => `
          <button class="ep-btn" id="ep-${c.id}" onclick="tocarEpisodio('${c.id}')">${c.index || c.índice || c.episode_index || c.id}</button>
        `).join("");
        
        if (caps.length > 0) tocarEpisodio(caps[0].id);
      } catch (e) {
        document.getElementById("det-sinopse").innerText = "Erro ao carregar episódios.";
      }
    }

    async function tocarEpisodio(chapterId) {
      const plat = document.getElementById("plataforma").value;
      const player = document.getElementById("player");
      const status = document.getElementById("player-status");
      document.querySelectorAll(".ep-btn").forEach(b => b.classList.remove("ativo"));
      const btn = document.getElementById(`ep-${chapterId}`);
      if (btn) btn.classList.add("ativo");

      status.innerText = "Carregando vídeo...";
      try {
        const epData = episodiosMap[chapterId] || {};
  const epNum = epData.index || epData.índice || epData.episode_index || chapterId;
const res = await fetch(WORKER_URL + "?endpoint=/api/v2/video&category_p=" + plat + "&lang=pt&id=" + dramaAtualId + "&chapter_id=" + epNum);

const json = await res.json();
const d = json.data || json;
const streams = d.streams || [];
let videoUrl = d.url || d.video_url || d.play_url || d.link || d.video || (streams.length > 0 ? (streams[0].url || streams[0].play_url) : null);
if (typeof json === 'string') videoUrl = json;
if (videoUrl) {
player.style.display = "block";
status.innerText = "";
if (hlsInstance) {
hlsInstance.destroy();
hlsInstance = null;
}
if (videoUrl.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
hlsInstance = new Hls();
hlsInstance.loadSource(videoUrl);
hlsInstance.attachMedia(player);
hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
player.play().catch(() => {});
});
} else {
player.src = videoUrl;
player.play().catch(() => {});
}
} else {
const msgErro = json.message || json.error || json.msg || JSON.stringify(json);
status.innerText = "Link de vídeo indisponível. Detalhe: " + msgErro;
}
} catch (e) {
status.innerText = "Erro ao carregar vídeo: " + e.message;
}
}
function voltarCatalogo() {
document.getElementById("detalhe-view").style.display = "none";
document.getElementById("home-view").style.display = "block";
const player = document.getElementById("player");
if (hlsInstance) {
hlsInstance.destroy();
hlsInstance = null;
}
player.pause();
player.src = "";
 
    }
  </script>
</body>
</html>
