<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo de Dramas</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #0f0f13);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; font-weight: 700; }
    select {
      background: var(--tg-theme-secondary-bg-color, #1e1e26);
      color: var(--tg-theme-text-color, #ffffff);
      border: 1px solid #333;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #1a1a22);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #252530;
    }
    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: 600;
    }
    .info { padding: 10px; }
    .title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .status {
      font-size: 11px;
      color: var(--tg-theme-hint-color, #999);
      margin-top: 4px;
    }
    .loading { text-align: center; padding: 40px 0; color: #888; }
  </style>
</head>
<body>
  <header>
    <h1>🔥 Dramas</h1>
    <select id="plataforma" onchange="carregarDramas()">
      <option value="storyreel">StoryReel</option>
      <option value="dramabox">DramaBox</option>
      <option value="reelshort">ReelShort</option>
      <option value="shortmax">ShortMax</option>
    </select>
  </header>

  <div id="conteudo" class="loading">Carregando catálogo...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const WORKER_URL = "https:/still-credit-78bb.dieginhomirante.workers.dev";

    async function carregarDramas() {
      const container = document.getElementById("conteudo");
      const plataforma = document.getElementById("plataforma").value;
      container.className = "loading";
      container.innerText = "Carregando dramas...";

      try {
        const res = await fetch(`${WORKER_URL}?endpoint=/api/v2/home&category_p=${plataforma}&lang=pt`);
        const json = await res.json();
        const lista = json.data || [];

        if (!lista.length) {
          container.innerText = "Nenhum drama encontrado nesta plataforma.";
          return;
        }

        container.className = "grid";
        container.innerHTML = lista.map(item => `
          <div class="card" onclick="abrirDrama('${item.id}', '${(item.title || '').replace(/'/g, "\\'")}')">
            <div class="poster-wrap">
              <img src="${item.cover}" alt="Capa" loading="lazy">
              <span class="badge">${item.chapters || '?'} eps</span>
            </div>
            <div class="info">
              <div class="title">${item.title}</div>
              <div class="status">${item.status || ''}</div>
            </div>
          </div>
        `).join("");
      } catch (e) {
        container.innerText = "Erro ao carregar catálogo. Tente novamente.";
      }
    }

    function abrirDrama(id, titulo) {
      tg.showAlert(`Você selecionou: ${titulo} (ID: ${id}). Em seguida vamos ativar o player de episódios!`);
    }

    carregarDramas();
  </script>
</body>
    </html>
