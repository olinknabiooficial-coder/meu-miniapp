<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dramas Streaming</title>
  <script>
    document.write('<scr' + 'ipt src="https:' + '//telegram.org/js/telegram-web-app.js"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="https:' + '//cdn.jsdelivr.net/npm/hls.js@latest"></scr' + 'ipt>');
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0b0f;
      color: #ffffff;
      min-height: 100vh;
    }
    /* Topo e Busca */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(11, 11, 15, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 14px;
      display: flex; gap: 8px;
      border-bottom: 1px solid #1e1e28;
    }
    select, input {
      background: #171720; color: #fff;
      border: 1px solid #2a2a38;
      padding: 10px 12px; border-radius: 10px;
      font-size: 14px; outline: none;
    }
    select { flex: 1; max-width: 145px; font-weight: 600; }
    input { flex: 2; }
    input::placeholder { color: #6e6e80; }

    /* Grade do Catálogo */
    .container { padding: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      background: #15151e; border-radius: 12px;
      overflow: hidden; cursor: pointer;
      border: 1px solid #22222f;
      transition: transform 0.15s;
    }
    .card:active { transform: scale(0.98); }
    .poster-wrap { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #1e1e2a; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .badge-eps {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0, 0, 0, 0.85); color: #fff;
      font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 700;
    }
    .card-info { padding: 10px; }
    .card-title {
      font-size: 13px; font-weight: 600; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .loading { text-align: center; padding: 50px 16px; color: #88889a; font-size: 14px; }

    /* Modal de Detalhes (Estilo Streaming) */
    #modal-detalhe {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0, 0, 0, 0.82);
      align-items: flex-end; justify-content: center;
    }
    .modal-sheet {
      width: 100%; max-width: 500px;
      background: #16161f;
      border-top-left-radius: 22px; border-top-right-radius: 22px;
      padding: 20px 18px 28px;
      border-top: 1px solid #2b2b3a;
      max-height: 88vh; overflow-y: auto;
    }
    .modal-header { display: flex; gap: 14px; position: relative; margin-bottom: 16px; }
    .modal-poster {
      width: 96px; height: 128px; border-radius: 12px;
      object-fit: cover; background: #232330; flex-shrink: 0;
    }
    .modal-meta { flex: 1; padding-right: 28px; }
    .plat-tag {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      color: #9e9eb3; text-transform: uppercase; margin-bottom: 4px;
    }
    .modal-title { font-size: 18px; font-weight: 700; line-height: 1.25; margin-bottom: 8px; }
    .pill-eps {
      display: inline-block; background: rgba(229, 9, 20, 0.18);
      color: #ff4d5a; border: 1px solid rgba(229, 9, 20, 0.4);
      font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    }
    .btn-close {
      position: absolute; top: 0; right: 0;
      width: 32px; height: 32px; border-radius: 50%;
      background: #252532; color: #ccc; border: none;
      font-size: 16px; cursor: pointer;
    }
    .desc-label { font-size: 11px; font-weight: 700; color: #88889a; letter-spacing: 0.8px; margin-bottom: 6px; }
    .desc-text { font-size: 13px; color: #c8c8d8; line-height: 1.5; margin-bottom: 20px; }
    .modal-actions { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
    .btn-primary {
      background: #e50914; color: #fff; border: none;
      padding: 12px 10px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .btn-sec {
      background: #22222e; color: #e2e2ec; border: 1px solid #323244;
      padding: 12px 8px; border-radius: 12px; font-weight: 600; font-size: 12px; cursor: pointer;
    }

    /* Tela do Player Fixo */
    #player-view { display: none; padding-bottom: 30px; }
    .player-top {
      padding: 10px 14px; display: flex; align-items: center; gap: 10px;
      background: #12121a; border-bottom: 1px solid #22222e;
    }
    .btn-back {
      background: #232330; color: #fff; border: none;
      padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .player-box {
      width: 100%; background: #000; position: relative;
      aspect-ratio: 16 / 9; max-height: 62vh;
    }
    video { width: 100%; height: 100%; display: block; background: #000; }
    .status-bar {
      padding: 8px 14px; font-size: 12px; color: #f5c518;
      background: #14141d; border-bottom: 1px solid #22222e; word-break: break-word;
    }
    .ep-section { padding: 14px; }
    .ep-header { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #e2e2ec; }
    .ep-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .ep-btn {
      background: #1a1a24; color: #fff; border: 1px solid #2c2c3b;
      padding: 11px 0; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .ep-btn.ativo { background: #e50914; border-color: #e50914; }
  </style>
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="home-view">
    <div class="topbar">
      <select id="plataforma" onchange="carregarDramas()"></select>
      <input type="search" id="busca" placeholder="Buscar drama..." onkeyup="if(event.key==='Enter') buscarDramas()">
    </div>
    <div class="container">
      <div id="conteudo" class="loading">Carregando catálogo...</div>
    </div>
  </div>

  <!-- MODAL DE DETALHES -->
  <div id="modal-detalhe" onclick="if(event.target===this) fecharModal()">
    <div class="modal-sheet">
      <div class="modal-header">
        <img id="mod-capa" class="modal-poster" src="" alt="">
        <div class="modal-meta">
          <div id="mod-plat" class="plat-tag">STORYREEL</div>
          <div id="mod-titulo" class="modal-title">Carregando...</div>
          <span id="mod-eps" class="pill-eps">▶ ? eps</span>
        </div>
        <button class="btn-close" onclick="fecharModal()">✕</button>
      </div>
      <div class="desc-label">DESCRIÇÃO</div>
      <div id="mod-desc" class="desc-text">Carregando informações...</div>
      <div class="modal-actions">
        <button class="btn-primary" onclick="iniciarPlayer(0)">▶ Assistir agora</button>
        <button class="btn-sec" onclick="iniciarPlayer(0)">Ver episódios</button>
        <button class="btn-sec" onclick="fecharModal()">Voltar</button>
      </div>
    </div>
  </div>

  <!-- TELA DO PLAYER FIXO -->
  <div id="player-view">
    <div class="player-top">
      <button class="btn-back" onclick="voltarDoPlayer()">← Catálogo</button>
      <div id="play-titulo" style="font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
    </div>
    <div class="player-box">
      <video id="video-player" controls playsinline></video>
    </div>
    <div id="status-msg" class="status-bar" style="display:none;"></div>
    <div class="ep-section">
      <div class="ep-header">Episódios</div>
      <div id="ep-lista" class="ep-grid"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https:' + '//api-dramas-worker.dieginhomirante.workers.dev';
    const PLATAFORMAS = [
      ["storyreel","StoryReel"],["dramabox","DramaBox"],["reelshort","ReelShort"],["shortmax","ShortMax"],
      ["goodshort","GoodShort"],["flickreels","FlickReels"],["flextv","FlexTV"],["moboreels","MoboReels"],
      ["kalostv","Kalos TV"],["starshort","StarShort"],["stardusttv","StardustTV"],["vigloo","Vigloo"],
      ["netshort","NetShort"],["dramawave","DramaWave"],["mydrama","MyDrama"],["wetv","WeTV"],
      ["iqiyi","iQIYI"],["playlet","Playlet"],["snackshort","SnackShort"],["reelife","Reelife"]
    ];

    let dramaAtual = null;
    let capitulosAtuais = [];
    let hls = null;

    window.addEventListener('load', function() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
      const sel = document.getElementById("plataforma");
      sel.innerHTML = PLATAFORMAS.map(function(p) {
        return '<option value="' + p[0] + '">' + p[1] + '</option>';
      }).join("");

      const startParam = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe)
        ? window.Telegram.WebApp.initDataUnsafe.start_param : "";

      if (startParam && startParam.indexOf("p_") === 0) {
        const partes = startParam.split("_");
        if (partes.length >= 3) {
          sel.value = partes[1];
          carregarDramas();
          abrirModalDrama(partes.slice(2).join("_"), "Drama " + partes[2], "");
          return;
        }
      }
      carregarDramas();
    });

    async function carregarDramas() {
      const box = document.getElementById("conteudo");
      const plat = document.getElementById("plataforma").value;
      box.className = "loading";
      box.innerText = "Carregando catálogo...";
      try {
        const r = await fetch(WORKER_URL + "?endpoint=/api/v2/home&category_p=" + plat + "&lang=pt");
        const j = await r.json();
        renderizarCards(j.data || []);
      } catch (e) {
        box.innerText = "Erro ao carregar catálogo: " + e.message;
      }
    }
